<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>家政教室・物理 × 3DGS 雛形（球在輻射場裡彈跳）</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden;font-family:-apple-system,"PingFang TC",system-ui;color:#e6edf3}
  #c{width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
  #hud{position:fixed;left:14px;top:12px;z-index:5;background:rgba(11,14,20,.62);border:1px solid #222b38;border-radius:10px;padding:8px 12px;font-size:12.5px;backdrop-filter:blur(6px);max-width:240px}
  #hud b{color:#ff7a18} #hud .tag{display:inline-block;background:#1b2230;border:1px solid #ff7a18;color:#ff7a18;border-radius:14px;padding:1px 9px;font:700 10px system-ui;letter-spacing:1px;margin-bottom:4px}
  #back{position:fixed;right:14px;top:12px;z-index:5;color:#8b97a7;font-size:12.5px;text-decoration:none;background:rgba(11,14,20,.62);border:1px solid #222b38;border-radius:10px;padding:8px 12px}
  #btns{position:fixed;left:14px;bottom:14px;z-index:5;display:flex;gap:8px}
  .b{background:#ff7a18;color:#fff;border:none;border-radius:8px;padding:9px 14px;font:700 13px system-ui;cursor:pointer}
  .b.alt{background:#1b2230;border:1px solid #33b1ff;color:#33b1ff}
  #load{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0e14;transition:opacity .5s}
  #bar{width:240px;height:5px;background:#222b38;border-radius:3px;overflow:hidden;margin-top:12px}#fill{height:100%;width:0;background:#ff7a18}
  #pct{margin-top:8px;color:#8b97a7;font-size:12px}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span class="tag">物理 × 3DGS · 報告專案4 雛形</span><br><b>點畫面＝朝該方向投球</b><br><span style="color:#8b97a7">球用真實重力＋從 COLMAP 點算出的地板/牆面彈跳。拖曳環視。</span></div>
<a id="back" href="gs4d-explore.html">← 探索紀錄</a>
<div id="btns"><button class="b" id="drop">⬇ 灑一批球</button><button class="b alt" id="clear">清空</button></div>
<div id="load"><div style="font-size:14px">家政教室・物理 × 3DGS</div><div id="bar"><div id="fill"></div></div><div id="pct">下載場景…</div></div>
<script type="module">
import * as pc from 'https://cdn.jsdelivr.net/npm/playcanvas@2.10.1/build/playcanvas.mjs';
const ALIGN=[-0.97992,0.0,0.07992,0.18267];      // floor-plane fit (true up→+Y)
const SPAWN=[-0.048,-0.014,0.125];
const FLOOR=-2.42, CEIL=1.68, MINX=-5.71, MAXX=7.82, MINZ=-5.25, MAXZ=6.61;  // from COLMAP points (aligned)
const G=9.8, R=0.2, REST=0.55, FRIC=0.82;

const canvas=document.getElementById('c');
const app=new pc.Application(canvas,{mouse:new pc.Mouse(canvas),touch:new pc.TouchDevice(canvas),
  graphicsDeviceOptions:{antialias:true,preserveDrawingBuffer:true}});
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW); app.setCanvasResolution(pc.RESOLUTION_AUTO);
addEventListener('resize',()=>app.resizeCanvas()); app.start(); window.__app=app;

const cam=new pc.Entity('cam');
cam.addComponent('camera',{clearColor:new pc.Color(0.925,0.925,0.933),fov:70,nearClip:0.02,farClip:80});
app.root.addChild(cam);
const light=new pc.Entity(); light.addComponent('light',{type:'directional',intensity:1.0});
light.setEulerAngles(60,30,0); app.root.addChild(light);
const amb=new pc.Entity(); amb.addComponent('light',{type:'omni',intensity:0.4,range:30}); amb.setPosition(0,1,0); app.root.addChild(amb);

let yaw=150,pitch=-14;
function applyCam(){ cam.setPosition(SPAWN[0],SPAWN[1],SPAWN[2]); cam.setEulerAngles(pitch,yaw,0); }
applyCam();

// ---- balls ----
const COLORS=[[1,.45,.1],[.2,.7,1],[.3,.85,.4],[1,.8,.2],[.9,.3,.5],[.6,.4,.95]];
const balls=[]; let ci=0; window.__balls=balls;
function mkMat(c){const m=new pc.StandardMaterial();m.diffuse=new pc.Color(c[0],c[1],c[2]);m.emissive=new pc.Color(c[0]*.6,c[1]*.6,c[2]*.6);m.gloss=.5;m.update();return m;}
function addBall(p,v){
  const e=new pc.Entity(); e.addComponent('render',{type:'sphere'});
  e.render.material=mkMat(COLORS[ci++%COLORS.length]);
  e.setLocalScale(R*2,R*2,R*2); e.setPosition(p.x,p.y,p.z); app.root.addChild(e);
  balls.push({e,p:p.clone(),v:v.clone()});
}
function drop(){ const f=cam.forward; const cx=SPAWN[0]+f.x*2.6, cz=SPAWN[2]+f.z*2.6; for(let i=0;i<6;i++){ addBall(new pc.Vec3(cx+(Math.random()-.5)*1.8,CEIL-0.4,cz+(Math.random()-.5)*1.8),new pc.Vec3(0,0,0)); } }
function clearAll(){ balls.forEach(b=>b.e.destroy()); balls.length=0; }
document.getElementById('drop').onclick=drop;
document.getElementById('clear').onclick=clearAll;

let __last=performance.now();
function physStep(){
  const now=performance.now(); let dt=Math.min((now-__last)/1000,0.033); __last=now;
  for(const b of balls){
    b.v.y-=G*dt;
    b.p.x+=b.v.x*dt; b.p.y+=b.v.y*dt; b.p.z+=b.v.z*dt;
    if(b.p.y-R<FLOOR){ b.p.y=FLOOR+R; b.v.y=-b.v.y*REST; b.v.x*=FRIC; b.v.z*=FRIC; if(Math.abs(b.v.y)<0.4)b.v.y=0; }
    if(b.p.y+R>CEIL){ b.p.y=CEIL-R; b.v.y=-b.v.y*REST; }
    if(b.p.x-R<MINX){b.p.x=MINX+R;b.v.x=-b.v.x*REST;} if(b.p.x+R>MAXX){b.p.x=MAXX-R;b.v.x=-b.v.x*REST;}
    if(b.p.z-R<MINZ){b.p.z=MINZ+R;b.v.z=-b.v.z*REST;} if(b.p.z+R>MAXZ){b.p.z=MAXZ-R;b.v.z=-b.v.z*REST;}
    b.e.setPosition(b.p.x,b.p.y,b.p.z);
  }
  requestAnimationFrame(physStep);
}
requestAnimationFrame(physStep);

// throw on click (along look dir); drag to look
let down=false,moved=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{down=true;moved=false;lx=e.clientX;ly=e.clientY;});
addEventListener('pointermove',e=>{ if(!down)return; if(Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly)>4)moved=true;
  yaw-=(e.clientX-lx)*0.2; pitch=Math.max(-88,Math.min(88,pitch-(e.clientY-ly)*0.2)); lx=e.clientX;ly=e.clientY; applyCam();});
addEventListener('pointerup',e=>{ if(down&&!moved){ const f=cam.forward; addBall(new pc.Vec3(SPAWN[0]+f.x*0.4,SPAWN[1]+f.y*0.4,SPAWN[2]+f.z*0.4), new pc.Vec3(f.x*7,f.y*7+1.5,f.z*7)); } down=false;});

async function load(){
  const res=await fetch('assets/homeec_1600_web.compressed.ply');
  const total=+res.headers.get('Content-Length')||39000000;
  const rd=res.body.getReader(); const ch=[]; let got=0;
  for(;;){const{done,value}=await rd.read(); if(done)break; ch.push(value); got+=value.length;
    const p=Math.min(100,Math.round(got/total*100)); document.getElementById('fill').style.width=p+'%';
    document.getElementById('pct').textContent=`下載場景 ${p}%`;}
  document.getElementById('pct').textContent='解碼中…';
  const asset=new pc.Asset('he','gsplat',{url:URL.createObjectURL(new Blob(ch)),filename:'s.compressed.ply'});
  asset.on('load',()=>{
    const e=new pc.Entity('splat'); e.addComponent('gsplat',{asset});
    e.setLocalRotation(new pc.Quat(ALIGN[0],ALIGN[1],ALIGN[2],ALIGN[3])); app.root.addChild(e);
    applyCam(); drop();
    const l=document.getElementById('load'); l.style.opacity=0; setTimeout(()=>l.style.display='none',500);
  });
  asset.on('error',err=>document.getElementById('pct').textContent='載入失敗：'+err);
  app.assets.add(asset); app.assets.load(asset);
}
load();
</script></body></html>
